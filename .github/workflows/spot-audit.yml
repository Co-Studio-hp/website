# HPスポット監査（手動実行専用）
# ページ棚卸し用に GA4 / Search Console のページ別データを取得し、artifactとして保存する。
# 定期実行はしない。Actionsタブ →「Spot Audit」→「Run workflow」で手動実行。

name: Spot Audit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/weekly-seo-report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/weekly-seo-report/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run spot audit
        run: node audit.js
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || '' }}

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: audit-result
          path: scripts/weekly-seo-report/audit-result.json
          retention-days: 7
