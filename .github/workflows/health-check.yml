# 日次ヘルスチェック。
# Uptime Check（15分ごと・トップの200判定のみ）では拾えない
# 「表示されているが中身が壊れている」状態を検知する。
name: Health Check

on:
  schedule:
    # JST 8:00 = UTC 23:00（前日）
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/health-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/health-check/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run health check
        run: node check.mjs
        env:
          SLACK_HP_WEBHOOK_URL: ${{ secrets.SLACK_HP_WEBHOOK_URL }}
